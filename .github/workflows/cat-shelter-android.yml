name: Build Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [cat-shelter-kind-hands]
    paths:
      - 'cat-shelter/mobile/**'
      - '.github/workflows/cat-shelter-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: cat-shelter/mobile
        run: npm install --no-audit --no-fund
      - name: Configure Android project
        working-directory: cat-shelter/mobile
        run: npm run android:create
      - name: Assemble APK
        working-directory: cat-shelter/mobile/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lapki-dobra-android-debug
          path: cat-shelter/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
